name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  simulation-ghdl:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Check out en_cl_fix of Open Logic
        # compile_order.txt of Open Logic lists the files of its submodule; the submodules of the cores are not needed
        run: git -C cores/open-logic-ft submodule update --init --depth 1 3rdParty/en_cl_fix
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python packages
        # vunit_hdl 5.0.0.dev7 is an sdist whose build needs pkg_resources (setuptools < 81)
        run: |
          python -m pip install "setuptools<81" wheel "setuptools_scm>=8"
          python -m pip install --no-build-isolation -r requirements.txt
      - name: Set up GHDL
        uses: ghdl/setup-ghdl@v1
        with:
          version: latest
          backend: mcode
      - name: Analyse the sources of all systems
        run: python run.py --compile

  linting:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: python -m pip install vsg==3.27 pycryptodome pytest
      - name: Submodules match the Composer files
        run: python tools/check_pins.py
      - name: Composer version of the generated top levels
        id: composer
        run: echo "ref=$(cat tools/composer_ref.txt)" >> "$GITHUB_OUTPUT"
      - name: Check out the Composer
        uses: actions/checkout@v7
        with:
          repository: open-space-hdl/open-space-hdl.github.io
          ref: ${{ steps.composer.outputs.ref }}
          path: .composer
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Generated top levels match the Composer files
        run: python tools/check_hdl.py --composer .composer
      - name: VHDL lint (VSG)
        run: python lint/lint.py
      - name: Host software tests
        run: python -m pytest -q
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          config: .markdownlint.json
          globs: |
            *.md
            docs/**/*.md
            systems/**/*.md
            !systems/*/hdl/**
