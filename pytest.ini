[pytest]
pythonpath = sw
testpaths = sw/tests tools/tests systems
python_files = test_*.py
# no cache directory in the repository; markers are declared
addopts = -p no:cacheprovider --strict-markers
markers =
    tc(name): test case of a hardware test (TC-RS-HW-nn)
    requirement(*ids): requirements that a hardware test case confirms, with the prefix of their core (OCP:CH-IF-01)
    operator: hardware test case with a step of the operator at the far end
